<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الحسام للمحاسبة والمستودعات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f7b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#1b1f24;--m:#6b7280;--p:#0f7b4f;--p-hover:#0c623e;--b:#e5e7eb;--r:#c0392b;--g:#f59e0b;--shadow:0 2px 8px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#121417;--c:#1e2328;--t:#e8eaed;--m:#9aa3ad;--b:#2d343a;--shadow:0 2px 8px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--c);border-bottom:1px solid var(--b);box-shadow:var(--shadow);z-index:10}
header .info{font-size:13px;line-height:1.4}
header .title{font-weight:800;font-size:16px;color:var(--p)}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:9;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:80px;padding:12px 8px;border:0;background:none;color:var(--m);font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s}
nav button.on{color:var(--p);border-color:var(--p)}
main{padding:12px;max-width:900px;margin:auto;width:100%;flex:1;overflow-y:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
h2,h3{margin:0 0 12px;font-weight:700}
h3{font-size:16px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;margin-bottom:10px;transition:border .2s}
input:focus,select:focus{outline:none;border-color:var(--p)}
button.b{padding:12px 16px;border:0;border-radius:8px;background:var(--p);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:background .2s}
button.b:active{background:var(--p-hover)}
button.b:disabled{opacity:.6;cursor:not-allowed}
button.b.s{background:var(--b);color:var(--t)}
button.b.r{background:var(--r)}
button.b.g{background:var(--g)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.row>*{flex:1;margin-bottom:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .1s}
.it:last-child{border-bottom:0}
.it:active{background:var(--bg)}
.it .name{font-weight:600}
.m{color:var(--m);font-size:13px}
.neg{color:var(--r)!important}.ok{color:var(--p)!important}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--b);text-align:start;font-size:13px}
th{color:var(--m);font-weight:600}
.strike{text-decoration:line-through;opacity:.6}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:var(--b)}
.badge.p{background:var(--p);color:#fff}
.badge.r{background:var(--r);color:#fff}
#toast{position:fixed;bottom:20px;left:16px;right:16px;background:#1f2937;color:#fff;padding:14px 18px;border-radius:12px;text-align:center;font-weight:600;display:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#scan{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#reader{width:100%;max-width:480px;border-radius:12px;overflow:hidden}
#scan .msg{color:#fff;text-align:center;font-weight:600}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;width:72mm;font:12px Tahoma,sans-serif;color:#000;padding:4mm}}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;padding:8px 16px;border-radius:20px;background:var(--b);color:var(--t);border:0;font:inherit;font-size:13px;font-weight:600}
.tabs button.on{background:var(--p);color:#fff}
.quick-btn{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:30px;background:var(--p);color:#fff;border:0;font-size:24px;box-shadow:0 4px 12px rgba(15,123,79,.4);z-index:100;display:flex;align-items:center;justify-content:center}
@media(min-width:768px){.quick-btn{width:70px;height:70px;bottom:30px;right:30px}}
.big-total{font-size:32px;font-weight:800;color:var(--p);text-align:center;margin:16px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="rcpt"></div>
<div id="scan"><div id="reader"></div><div class="msg" id="sh">جاري التحميل...</div><button class="b r" onclick="closeScan()" style="width:100%;max-width:300px">إغلاق</button></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const URL_='https://ksucofupdifqtkcxybcp.supabase.co';
const KEY='sb_publishable_H3ArR_q2t5uTdD5Dp8PwHg_8sMDvaeX';
const db=supabase.createClient(URL_,KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en',{maximumFractionDigits:2});
const norm=s=>String(s??'').trim().toLowerCase();
const uid=()=>crypto.randomUUID();
const today=()=>new Date().toISOString().slice(0,10);

let S={
  shop:null, member:null, branch:null, branchObj:null, wh:null, whs:[], branches:[],
  prods:[], parts:[], cats:[], cart:[], cur:'SYP', rate:1,
  tab:'sale', mode:'sale', busy:false,
  cogs:[], // for UI
  hist:[], histKind:'sale'
};

function toast(m,type='info'){
  const t=$('#toast');
  t.textContent=m;
  t.style.background = type==='error'?'var(--r)':(type==='ok'?'var(--p)':'#1f2937');
  t.style.display='block';
  clearTimeout(toast.t);
  toast.t=setTimeout(()=>t.style.display='none',4000);
}

async function rpc(fn,args={}) {
  const {data,error}=await db.rpc(fn,args);
  if(error){toast(error.message,'error');throw error;}
  return data;
}

// ============= AUTH =============
db.auth.onAuthStateChange((e,s)=>{
  if(e==='SIGNED_OUT') location.reload();
});

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session) return loginView();
  await loadShop();
}

function loginView(){
  $('#app').innerHTML=`<main style="display:flex;align-items:center;justify-content:center;height:100vh">
  <div class="card" style="width:100%;max-width:400px">
    <h2 style="text-align:center;color:var(--p)">الحسام للمحاسبة</h2>
    <p class="m" style="text-align:center;margin-bottom:16px">سجّل الدخول للمتابعة</p>
    <input id=em type=email dir=ltr placeholder="البريد الإلكتروني">
    <input id=pw type=password dir=ltr placeholder="كلمة المرور">
    <div class="row">
      <button class="b" style="flex:2" onclick="doAuth(0)">دخول</button>
      <button class="b s" onclick="doAuth(1)">حساب جديد</button>
    </div>
    <button class="b s" style="width:100%;margin-top:8px" onclick="forgot()">نسيت كلمة المرور</button>
  </div></main>`;
}
async function doAuth(up){
  const e=$('#em').value.trim(),p=$('#pw').value;
  if(!e||!p)return toast('أدخل البريد وكلمة المرور','error');
  const {data,error}=up?await db.auth.signUp({email:e,password:p}):await db.auth.signInWithPassword({email:e,password:p});
  if(error)return toast(error.message,'error');
  if(!data.session)return toast('تم إنشاء الحساب. تحقق من بريدك للتأكيد ثم سجّل الدخول.','ok');
  await loadShop();
}
async function forgot(){
  const e=$('#em').value.trim();
  if(!e)return toast('أدخل بريدك أولاً','error');
  const {error}=await db.auth.resetPasswordForEmail(e);
  toast(error?error.message:'تم إرسال رابط إعادة التعيين','ok');
}

// ============= INIT =============
async function loadShop(){
  const {data:{user}}=await db.auth.getUser();
  if(!user)return loginView();
  
  // find shop
  const {data:m}=await db.from('shop_members').select('shop_id, role, max_discount_pct').eq('user_id',user.id).eq('active',true).limit(1).single();
  
  if(!m){
    // create new shop view
    $('#app').innerHTML=`<main style="display:flex;align-items:center;justify-content:center;height:100vh">
    <div class="card" style="width:100%;max-width:400px">
      <h3>إنشاء محل جديد</h3>
      <p class="m">ابدأ بتسمية محلك</p>
      <input id=sn placeholder="اسم المحل">
      <button class="b" style="width:100%" onclick="createMyShop()">إنشاء المحل (تجربة 14 يوم)</button>
      <button class="b s" style="width:100%;margin-top:8px" onclick="location.reload()">تحديث</button>
    </div></main>`;
    return;
  }

  const {data:sh}=await db.from('shops').select('*').eq('id',m.shop_id).single();
  S.shop=sh; S.member=m;
  
  // load branches
  const {data:brs}=await db.from('branches').select('*').eq('shop_id',sh.id).eq('active',true);
  S.branches=brs||[];
  
  // get current branch from storage
  const savedBr=localStorage.husam_branch;
  S.branchObj=S.branches.find(b=>b.id===savedBr) || S.branches.find(b=>b.is_default) || S.branches[0];
  S.branch=S.branchObj?.id;

  // get exchange rate for today
  try {
    S.rate = await rpc('get_rate',{p_shop:S.shop.id, p_currency:'USD', p_date:today()});
  } catch(e) {
    S.rate = sh.usd_rate || 1;
  }

  await refreshData();
  shell();
}

async function createMyShop(){
  const n=$('#sn').value.trim();
  if(!n)return toast('اسم المحل مطلوب','error');
  try{
    await rpc('create_shop',{p_name:n});
    await loadShop();
  }catch(e){}
}

async function refreshData(){
  const [p, pt, wh, sl, cat] = await Promise.all([
    db.from('v_product_stock').select('*').eq('shop_id',S.shop.id).order('name'),
    db.from('partners').select('*').eq('shop_id',S.shop.id).eq('active',true).order('name'),
    db.from('warehouses').select('*').eq('branch_id',S.branch).eq('active',true),
    db.from('stock_levels').select('product_id,warehouse_id,qty').eq('shop_id',S.shop.id),
    db.from('categories').select('*').eq('shop_id',S.shop.id).eq('active',true).order('name')
  ]);
  S.prods=p.data||[];
  S.parts=pt.data||[];
  S.whs=wh.data||[];
  S.cats=cat.data||[];
  S.lv={};
  (sl.data||[]).forEach(x=>S.lv[x.product_id+'|'+x.warehouse_id]=+x.qty);
  
  if(!S.wh || !S.whs.find(w=>w.id===S.wh)){
    S.wh = (S.whs.find(w=>w.is_default)||S.whs[0])?.id;
  }
}

const lvl=(pid,wid)=>S.lv[pid+'|'+wid]||0;

// ============= UI SHELL =============
function shell(){
  const tabs = [
    {k:'sale', n:'بيع', icon:'🛒'},
    {k:'buy', n:'شراء', icon:'📥'},
    {k:'hist', n:'الفواتير', icon:'🧾'},
    {k:'prod', n:'المنتجات', icon:'📦'},
    {k:'debt', n:'الديون', icon:'💰'},
    {k:'rep', n:'التقارير', icon:'📊'},
    {k:'stock', n:'المخزون', icon:'🏭'},
    {k:'mfg', n:'التصنيع', icon:'⚙️'},
    {k:'acc', n:'الحسابات', icon:'📒'},
    {k:'team', n:'الفريق', icon:'👥'}
  ];
  
  $('#app').innerHTML=`<header>
    <div class="info">
      <div class="title">${esc(S.shop.name)}</div>
      <div class="m">${esc(S.branchObj?.name||'')} · $ ${fmt(S.rate)}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="b s" style="padding:8px 12px" onclick="switchBranch()">🔄</button>
      <button class="b s" style="padding:8px 12px" onclick="db.auth.signOut()">خروج</button>
    </div>
  </header>
  <nav>${tabs.map(t=>`<button data-k="${t.k}" onclick="go('${t.k}')">${t.icon} ${t.n}</button>`).join('')}</nav>
  <main id="v"></main>`;
  go(S.tab);
}

function switchBranch(){
  if(S.branches.length<2)return toast('لا توجد فروع أخرى');
  const names=S.branches.map((b,i)=>`${i+1}. ${b.name}`).join('\n');
  const v=prompt('اختر رقم الفرع:\n'+names);
  const idx=parseInt(v)-1;
  if(idx>=0 && idx<S.branches.length){
    S.branchObj=S.branches[idx];
    S.branch=S.branchObj.id;
    localStorage.husam_branch=S.branch;
    refreshData().then(()=>shell());
  }
}

function go(k){
  S.tab=k;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const map={sale:viewSale,buy:viewSale,hist:viewHist,prod:viewProds,debt:viewDebt,rep:viewRep,stock:viewStock,mfg:viewMfg,acc:viewAcc,team:viewTeam};
  const fn=map[k];
  if(fn) fn();
}

// ============= SALE / BUY =============
function viewSale(){
  S.mode = S.tab;
  if(S.cart.length===0) S.cart=[];
  const isSale = S.mode==='sale';
  const partners = S.parts.filter(p=>p.kind===(isSale?'customer':'supplier'));
  
  $('#v').innerHTML=`
  <div class="card">
    <div class="row">
      <input id=q placeholder="ابحث بالاسم أو امسح باركود..." oninput="searchProd()" onkeydown="if(event.key==='Enter')searchProd(true)" autofocus>
      <button class="b" style="flex:0;padding:12px" onclick="startScan()">📷</button>
    </div>
    <div id=prodlist></div>
  </div>
  <div class="card" id=cartcard>
    <h3>الفاتورة (${isSale?'بيع':'شراء'})</h3>
    <div id=cartitems class="m">الفاتورة فارغة</div>
    <div class="big-total" id=total>0 ${S.cur}</div>
    <div class="row">
      <select id=cur onchange="changeCur(this.value)"><option value=SYP ${S.cur==='SYP'?'selected':''}>ل.س</option><option value=USD ${S.cur==='USD'?'selected':''}>USD</option></select>
      <select id=partner><option value="">${isSale?'زبون نقدي':'مورد نقدي'}</option>${partners.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    </div>
    ${S.whs.length>1?`<select id=whsel onchange="S.wh=this.value;renderProds()">${S.whs.map(w=>`<option value="${w.id}" ${w.id===S.wh?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`:''}
    <input id=paid type="number" inputmode="decimal" placeholder="المبلغ المدفوع (فارغ = الكل)">
    <div class="row">
      <button class="b" style="flex:2" onclick="submitInvoice()">${isSale?'تسجيل البيع':'تسجيل الشراء'}</button>
      <button class="b s" onclick="clearCart()">مسح</button>
    </div>
  </div>`;
  
  S.cur = isSale?'SYP':'SYP';
  renderCart();
  searchProd();
  setTimeout(()=>$('#q')?.focus(),100);
}

function searchProd(selectFirst=false){
  const q = norm($('#q').value);
  const list = S.prods.filter(p=>!q || norm(p.name).includes(q) || norm(p.barcode)===q).slice(0,10);
  
  if(selectFirst && list.length===1 && q){
    addToCart(list[0]);
    $('#q').value='';
    searchProd();
    return;
  }
  
  $('#prodlist').innerHTML = list.map(p=>{
    const stock = lvl(p.id, S.wh);
    return `<div class="it" onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>
      <div>
        <div class="name">${esc(p.name)}</div>
        <div class="m">المخزون: ${fmt(stock)} ${p.unit}</div>
      </div>
      <div style="text-align:end">
        <div class="name">${fmt(p.sale_price)}</div>
        <div class="m">${p.sale_currency}</div>
      </div>
    </div>`;
  }).join('') || '<div class="m" style="text-align:center;padding:20px">لا توجد نتائج</div>';
}

function addToCart(p){
  if(S.mode==='sale' && lvl(p.id, S.wh) <= 0) return toast('نفد المخزون في هذا المستودع','error');
  const existing = S.cart.find(x=>x.id===p.id);
  if(existing) existing.qty++;
  else {
    S.cart.push({
      id: p.id, name: p.name, qty: 1,
      price: S.mode==='sale'? p.sale_price : 0,
      unit: p.unit, maxStock: lvl(p.id, S.wh)
    });
  }
  renderCart();
}

function renderCart(){
  if(S.cart.length===0){
    $('#cartitems').innerHTML='<div class="m" style="text-align:center;padding:10px">الفاتورة فارغة</div>';
    $('#total').textContent='0 '+S.cur;
    return;
  }
  
  let total=0;
  $('#cartitems').innerHTML = S.cart.map((i,k)=>{
    total += (i.qty*i.price);
    return `<div class="it" style="cursor:default">
      <div style="flex:1">
        <div class="name">${esc(i.name)}</div>
        <div class="row" style="margin:4px 0 0 0">
          <input type="number" style="padding:4px 8px;margin:0;width:60px" value="${i.qty}" onchange="setQty(${k},this.value)" min="0.01" step="any">
          <span class="m">×</span>
          <input type="number" style="padding:4px 8px;margin:0;width:80px" value="${i.price}" onchange="setPrice(${k},this.value)" min="0" step="any">
        </div>
      </div>
      <div style="text-align:end">
        <div class="name">${fmt(i.qty*i.price)}</div>
        <button class="b r" style="padding:4px 8px;margin-top:4px;font-size:12px" onclick="S.cart.splice(${k},1);renderCart()">✕</button>
      </div>
    </div>`;
  }).join('');
  
  $('#total').textContent = fmt(total)+' '+S.cur;
}

function setQty(k,v){
  const n=+v;
  if(n>0) S.cart[k].qty=n;
  renderCart();
}
function setPrice(k,v){
  const n=+v;
  if(n>=0) S.cart[k].price=n;
  renderCart();
}
function changeCur(v){
  S.cur=v;
  renderCart();
}
function clearCart(){
  if(!S.cart.length)return;
  if(!confirm('مسح الفاتورة بالكامل؟'))return;
  S.cart=[];
  renderCart();
}

async function submitInvoice(){
  if(S.busy) return;
  if(!S.cart.length) return toast('الفاتورة فارغة','error');
  
  const total = S.cart.reduce((s,i)=>s+i.qty*i.price,0);
  const paidInput = $('#paid').value;
  let paid = paidInput===''? total : +paidInput;
  if(paid<0 || isNaN(paid)) return toast('مبلغ غير صحيح','error');
  
  S.busy=true;
  const btn = event.target;
  btn.disabled=true; btn.textContent='جارٍ...';
  
  try {
    const items = S.cart.map(i=>{
      if(S.mode==='sale') return {product_id:i.id, qty:i.qty, price:i.price};
      return {product_id:i.id, qty:i.qty, unit_cost:i.price};
    });
    
    const args = {
      p_shop: S.shop.id, p_branch: S.branch, p_wh: S.wh,
      p_partner: $('#partner').value||null,
      p_currency: S.cur, p_paid: paid,
      p_items: items, p_client: uid()
    };
    
    if(S.mode==='sale') await rpc('post_sale', args);
    else await rpc('post_purchase', args);
    
    toast('تم الحفظ بنجاح ✓','ok');
    S.cart=[]; S.cur='SYP';
    await refreshData();
    viewSale();
  } catch(e){}
  finally{
    S.busy=false;
  }
}

// ============= HISTORY =============
async function viewHist(){
  $('#v').innerHTML=`<div class="m" style="text-align:center;padding:20px">جاري التحميل...</div>`;
  
  const [sales, purchases] = await Promise.all([
    db.from('sales').select('id,sale_date,currency,total,paid,voided_at,partners(name)').eq('shop_id',S.shop.id).order('created_at',{ascending:false}).limit(30),
    db.from('purchases').select('id,purchase_date,currency,total,paid,voided_at,partners(name)').eq('shop_id',S.shop.id).order('created_at',{ascending:false}).limit(30)
  ]);
  
  const all = [
    ...(sales.data||[]).map(x=>({...x,kind:'sale',date:x.sale_date})),
    ...(purchases.data||[]).map(x=>({...x,kind:'purchase',date:x.purchase_date}))
  ].sort((a,b)=>b.date.localeCompare(a.date));
  
  $('#v').innerHTML = `<div class="card">
    <h3>آخر الفواتير</h3>
    ${all.map(x=>`<div class="it" onclick="showInv('${x.id}','${x.kind}')">
      <div>
        <div class="name">${x.kind==='sale'?'بيع':'شراء'} #${x.id.slice(0,8)}</div>
        <div class="m">${x.date} · ${esc(x.partners?.name||'نقدي')}</div>
      </div>
      <div style="text-align:end">
        <div class="name ${x.voided_at?'strike':''}">${fmt(x.total)} ${x.currency}</div>
        <div class="m">${x.voided_at?'<span class="badge r">ملغاة</span>':(x.paid>=x.total?'مدفوعة':'<span class="badge">متبقي '+fmt(x.total-x.paid)+'</span>')}</div>
      </div>
    </div>`).join('') || '<div class="m" style="text-align:center;padding:20px">لا فواتير بعد</div>'}
  </div>`;
}

async function showInv(id,kind){
  const table = kind==='sale'? 'sales':'purchases';
  const itemsT = kind==='sale'? 'sale_items':'purchase_items';
  const fk = kind==='sale'? 'sale_id':'purchase_id';
  
  const [inv, items] = await Promise.all([
    db.from(table).select('*,partners(name)').eq('id',id).single(),
    db.from(itemsT).select('*,products(name)').eq(fk,id)
  ]);
  
  const inv_data = inv.data;
  const items_data = items.data||[];
  
  $('#v').innerHTML = `<div class="card">
    <h3>${kind==='sale'?'فاتورة بيع':'فاتورة شراء'} #${esc(inv_data.invoice_no)}</h3>
    <div class="m">التاريخ: ${kind==='sale'?inv_data.sale_date:inv_data.purchase_date}</div>
    <div class="m">الزبون/المورد: ${esc(inv_data.partners?.name||'نقدي')}</div>
    <div class="m">العملة: ${inv_data.currency} · سعر الصرف: ${fmt(inv_data.rate)}</div>
    ${inv_data.voided_at?'<div class="badge r" style="margin:8px 0">ملغاة</div>':''}
    
    <div style="margin:16px 0">
    ${items_data.map(i=>`<div class="it" style="cursor:default">
      <div>
        <div class="name">${esc(i.products?.name)}</div>
        <div class="m">${fmt(i.qty)} × ${fmt(i.price||i.unit_cost)}</div>
      </div>
      <div class="name">${fmt(i.line_total)}</div>
    </div>`).join('')}
    </div>
    
    <div class="big-total">${fmt(inv_data.total)} ${inv_data.currency}</div>
    <div class="m" style="text-align:center">مدفوع: ${fmt(inv_data.paid)} · متبقي: ${fmt(inv_data.total-inv_data.paid)}</div>
    
    <div class="row" style="margin-top:16px">
      <button class="b" onclick="printInv('${id}','${kind}')">🖨️ طباعة</button>
      ${!inv_data.voided_at && S.member.role!=='viewer'?`
      <button class="b r" onclick="voidInv('${id}','${kind}')">إلغاء</button>`:''}
    </div>
    <button class="b s" style="width:100%;margin-top:8px" onclick="viewHist()">رجوع</button>
  </div>`;
}

async function voidInv(id,kind){
  if(!confirm('إلغاء هذه الفاتورة؟ سيتم عكس المخزون والقيود.')) return;
  try {
    await rpc('void_invoice', {p_shop:S.shop.id, p_kind:kind, p_id:id});
    toast('تم الإلغاء ✓','ok');
    await refreshData();
    viewHist();
  }catch(e){}
}

function printInv(id,kind){
  const el = document.querySelector(`[onclick*="showInv('${id}'"]`);
  // We'll do a custom print
  window.print();
}

// ============= PRODUCTS =============
function viewProds(){
  const isOwner = ['owner','manager'].includes(S.member.role);
  $('#v').innerHTML = `
  ${isOwner?`<div class="card">
    <h3>إضافة منتج جديد</h3>
    <input id=pn placeholder="اسم المنتج">
    <div class="row">
      <input id=pb placeholder="باركود (اختياري)">
      <button class="b s" style="flex:0" onclick="scanBarcode('pb')">📷</button>
    </div>
    <div class="row">
      <input id=pp type="number" placeholder="سعر البيع">
      <select id=pc><option>SYP<option>USD</select>
    </div>
    <input id=pm type="number" placeholder="حد التنبيه للمخزون">
    <button class="b" style="width:100%" onclick="saveProd()">حفظ المنتج</button>
  </div>`:''}
  <div class="card">
    <h3>المنتجات (${S.prods.length})</h3>
    <input id=psearch placeholder="بحث..." oninput="filterProds()">
    <div id=prodgrid></div>
  </div>`;
  filterProds();
}

function filterProds(){
  const q = norm($('#psearch').value);
  const list = S.prods.filter(p=>!q || norm(p.name).includes(q) || norm(p.barcode)===q);
  $('#prodgrid').innerHTML = list.map(p=>`
    <div class="it" onclick="editProd('${p.id}')">
      <div>
        <div class="name">${esc(p.name)}</div>
        <div class="m">مخزون: ${fmt(p.total_qty)} ${p.unit} ${p.total_qty<=p.min_stock && p.min_stock>0?'<span class="badge r">قارب على النفاد</span>':''}</div>
      </div>
      <div style="text-align:end">
        <div class="name">${fmt(p.sale_price)} ${p.sale_currency}</div>
        ${p.barcode?`<div class="m" dir="ltr">${esc(p.barcode)}</div>`:''}
      </div>
    </div>`).join('') || '<div class="m" style="text-align:center;padding:20px">لا منتجات</div>';
}

async function saveProd(){
  const n=$('#pn').value.trim();
  if(!n) return toast('اسم المنتج مطلوب','error');
  try{
    const {error}=await db.from('products').insert({
      shop_id: S.shop.id, name: n, barcode: $('#pb').value.trim()||null,
      sale_price: +$('#pp').value||0, sale_currency: $('#pc').value,
      min_stock: +$('#pm').value||0
    });
    if(error) throw error;
    toast('تم حفظ المنتج ✓','ok');
    await refreshData();
    viewProds();
  } catch(e){ toast(e.message || e.code==='23505'?'باركود مكرر':e.message,'error'); }
}

async function editProd(id){
  const p = S.prods.find(x=>x.id===id);
  if(!p) return;
  if(!['owner','manager'].includes(S.member.role)) return toast('غير مصرح','error');
  
  $('#v').innerHTML = `<div class="card">
    <h3>تعديل منتج</h3>
    <input id=en value="${esc(p.name)}">
    <input id=eb value="${esc(p.barcode||'')}">
    <div class="row">
      <input id=ep type="number" value="${p.sale_price}">
      <select id=ec><option value=SYP ${p.sale_currency==='SYP'?'selected':''}>SYP<option value=USD ${p.sale_currency==='USD'?'selected':''}>USD</select>
    </div>
    <input id=ei type="number" value="${p.min_stock}">
    <div class="row">
      <button class="b" onclick="updateProd('${p.id}')">حفظ التعديل</button>
      <button class="b s" onclick="viewProds()">رجوع</button>
    </div>
    <button class="b r" style="width:100%;margin-top:8px" onclick="delProd('${p.id}')">حذف المنتج</button>
  </div>`;
}

async function updateProd(id){
  try{
    const {error}=await db.from('products').update({
      name: $('#en').value.trim(),
      barcode: $('#eb').value.trim()||null,
      sale_price: +$('#ep').value||0,
      sale_currency: $('#ec').value,
      min_stock: +$('#ei').value||0
    }).eq('id',id);
    if(error)throw error;
    toast('تم التعديل ✓','ok');
    await refreshData();
    viewProds();
  }catch(e){ toast(e.message,'error'); }
}

async function delProd(id){
  if(!confirm('حذف المنتج؟ سيختفي من القوائم لكن الفواتير القديمة تبقى.')) return;
  const {error}=await db.from('products').update({active:false}).eq('id',id);
  if(error)return toast(error.message,'error');
  await refreshData();
  toast('تم الحذف','ok');
  viewProds();
}

// ============= DEBT =============
async function viewDebt(){
  $('#v').innerHTML='<div class="m" style="text-align:center;padding:20px">جاري التحميل...</div>';
  const {data} = await db.from('v_partner_balances').select('*').eq('shop_id',S.shop.id).order('name');
  
  $('#v').innerHTML = `<div class="card">
    <h3>إضافة زبون/مورد</h3>
    <input id=an placeholder="الاسم">
    <input id=ap placeholder="الهاتف (اختياري)">
    <select id=ak><option value=customer>زبون<option value=supplier>مورد</select>
    <button class="b" style="width:100%" onclick="savePartner()">حفظ</button>
  </div>
  <div class="card">
    <h3>الأرصدة</h3>
    ${(data||[]).map(p=>{
      const v = p.kind==='customer'?p.receivable:p.payable;
      return `<div class="it" onclick="viewStmt('${p.partner_id}')">
        <div>
          <div class="name">${esc(p.name)}</div>
          <div class="m">${p.kind==='customer'?'زبون':'مورد'}</div>
        </div>
        <div class="name ${v>0?'neg':''}">${p.kind==='customer'?'عليه':'علينا'}: ${fmt(v)}</div>
      </div>`;
    }).join('')||'<div class="m" style="text-align:center;padding:20px">لا أحد</div>'}
  </div>`;
}

async function savePartner(){
  const n=$('#an').value.trim();
  if(!n)return toast('الاسم مطلوب','error');
  const {error}=await db.from('partners').insert({shop_id:S.shop.id, name:n, phone:$('#ap').value, kind:$('#ak').value});
  if(error)return toast(error.message,'error');
  toast('تم الحفظ ✓','ok');
  await refreshData();
  viewDebt();
}

async function viewStmt(pid){
  const p = S.parts.find(x=>x.id===pid);
  $('#v').innerHTML = `<div class="card"><h3>كشف حساب ${esc(p.name)}</h3><div id=stm class="m">جاري التحميل...</div></div>`;
  const today = new Date().toISOString().slice(0,10);
  const from = new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  try{
    const data = await rpc('account_statement',{p_shop:S.shop.id, p_partner:pid, p_from:from, p_to:today});
    $('#stm').innerHTML = data.length? `<table><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>${data.map(r=>`<tr><td>${r.entry_date}</td><td>${esc(r.description)}</td><td>${r.debit>0?fmt(r.debit):''}</td><td>${r.credit>0?fmt(r.credit):''}</td><td>${fmt(r.balance)}</td></tr>`).join('')}</table>` : 'لا حركات';
  }catch(e){}
}

// ============= SCANNER =============
let h5=null;
function startScan(){
  $('#scan').style.display='flex';
  $('#sh').textContent='وجه الكاميرا نحو الباركود';
  h5 = new Html5Qrcode("reader");
  h5.start({facingMode:"environment"}, {fps:10, qrbox:250}, (text)=>{
    closeScan();
    const p = S.prods.find(x=>norm(x.barcode)===norm(text));
    if(p) addToCart(p);
    else toast('باركود غير معروف: '+text,'error');
  }).catch(e=>{closeScan();toast('تعذر فتح الكاميرا','error');});
}
function closeScan(){
  $('#scan').style.display='none';
  if(h5){ h5.stop().catch(()=>{}); h5=null; }
}
function scanBarcode(inputId){
  $('#scan').style.display='flex';
  $('#sh').textContent='وجه الكاميرا نحو الباركود';
  h5 = new Html5Qrcode("reader");
  h5.start({facingMode:"environment"}, {fps:10, qrbox:250}, (text)=>{
    closeScan();
    document.getElementById(inputId).value=text;
  }).catch(e=>{closeScan();toast('تعذر فتح الكاميرا','error');});
}
